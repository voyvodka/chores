name: Labels

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions: {}

jobs:
  label-check:
    runs-on: ubuntu-latest
    steps:
      - name: Require a type label
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          echo "Labels: $LABELS"
          for type in bug enhancement documentation security performance dependencies regression; do
            if jq -e --arg t "$type" 'index($t) != null' <<<"$LABELS" >/dev/null; then
              exit 0
            fi
          done
          echo "::error::Add a type label: bug, enhancement, documentation, security, performance, dependencies or regression."
          exit 1
